<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>복리 계산기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --card: #1c1c1c;
    --border: #2a2a2a;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --gold-dim: rgba(201,168,76,0.12);
    --text: #e8e0d0;
    --muted: #7a7060;
    --accent: #4ca8c9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Serif KR', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px 80px;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: -10%;
    width: 60vw;
    height: 60vw;
    background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    right: -10%;
    width: 50vw;
    height: 50vw;
    background: radial-gradient(circle, rgba(76,168,201,0.04) 0%, transparent 70%);
    pointer-events: none;
  }

  header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeUp 0.7s ease both;
  }

  .header-label {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 300;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.1;
  }

  h1 span {
    color: var(--gold);
  }

  .subtitle {
    margin-top: 10px;
    font-size: 13px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 18px auto 0;
  }

  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    width: 100%;
    max-width: 860px;
    animation: fadeUp 0.7s 0.15s ease both;
  }

  @media (max-width: 640px) {
    .main-grid { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    position: relative;
  }

  .card-title {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .field {
    margin-bottom: 18px;
  }

  label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  label .val {
    color: var(--gold-light);
    font-size: 13px;
    font-weight: 500;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    position: relative;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--gold);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(201,168,76,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
  }

  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
    box-shadow: 0 0 14px rgba(201,168,76,0.6);
  }

  input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--gold);
    border: none;
    cursor: pointer;
  }

  .number-input {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 8px;
  }

  .number-input input[type="number"] {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    padding: 8px 12px;
    width: 120px;
    outline: none;
    transition: border-color 0.2s;
  }

  .number-input input[type="number"]:focus {
    border-color: var(--gold);
  }

  .number-input input[type="number"]::-webkit-inner-spin-button,
  .number-input input[type="number"]::-webkit-outer-spin-button {
    opacity: 0;
  }

  .freq-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .freq-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 6px 12px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  .freq-btn:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .freq-btn.active {
    background: var(--gold-dim);
    border-color: var(--gold);
    color: var(--gold);
  }

  /* Result card */
  .result-card {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, #1a1810 0%, #161c1e 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
    animation: fadeUp 0.7s 0.3s ease both;
    position: relative;
    overflow: hidden;
  }

  .result-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--accent), transparent);
  }

  .result-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 20px;
    margin-bottom: 28px;
  }

  .result-main {
    flex: 1;
    min-width: 200px;
  }

  .result-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .result-amount {
    font-size: clamp(2rem, 5vw, 3.2rem);
    font-weight: 300;
    color: var(--gold-light);
    letter-spacing: -0.03em;
    line-height: 1;
    transition: all 0.4s;
  }

  .result-breakdown {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }

  .breakdown-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .breakdown-label {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .breakdown-val {
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    color: var(--text);
  }

  .breakdown-val.interest {
    color: var(--accent);
  }

  /* Chart */
  .chart-wrap {
    margin-top: 8px;
    position: relative;
    height: 120px;
  }

  canvas {
    width: 100% !important;
    height: 120px !important;
    display: block;
  }

  /* Year table */
  .table-card {
    grid-column: 1 / -1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    animation: fadeUp 0.7s 0.45s ease both;
    max-height: 320px;
    overflow-y: auto;
  }

  .table-card::-webkit-scrollbar { width: 4px; }
  .table-card::-webkit-scrollbar-track { background: var(--surface); border-radius: 4px; }
  .table-card::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'DM Mono', monospace;
    font-size: 12px;
  }

  thead th {
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-size: 10px;
    padding: 0 8px 12px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }

  thead th:first-child { text-align: left; }

  tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.03);
    transition: background 0.15s;
  }

  tbody tr:hover { background: rgba(201,168,76,0.04); }

  tbody td {
    padding: 9px 8px;
    text-align: right;
    color: var(--muted);
  }

  tbody td:first-child { text-align: left; color: var(--text); }
  tbody td.highlight { color: var(--gold-light); }
  tbody td.int { color: var(--accent); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .separator {
    width: 100%;
    max-width: 860px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--border), transparent);
    margin: 0;
  }
</style>
</head>
<body>

<header>
  <div class="header-label">Financial Tool</div>
  <h1>복리 <span>계산기</span></h1>
  <p class="subtitle">Compound Interest Calculator</p>
  <div class="divider"></div>
</header>

<div class="main-grid">

  <!-- Input Card 1 -->
  <div class="card">
    <div class="card-title">초기 설정</div>

    <div class="field">
      <label>초기 투자금 <span class="val" id="principalDisplay">₩1,000,000</span></label>
      <input type="range" id="principal" min="1000000" max="300000000" step="1000000" value="1000000" oninput="update()">
      <div class="number-input">
        <input type="number" id="principalNum" value="1000000" min="1000000" max="300000000" step="1000000" oninput="syncFromNum('principal','principalNum'); update()">
        <span style="color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;">원</span>
      </div>
    </div>

    <div class="field">
      <label>월 추가 납입금 <span class="val" id="monthlyDisplay">₩100,000</span></label>
      <input type="range" id="monthly" min="100000" max="10000000" step="100000" value="100000" oninput="update()">
      <div class="number-input">
        <input type="number" id="monthlyNum" value="100000" min="100000" max="10000000" step="100000" oninput="syncFromNum('monthly','monthlyNum'); update()">
        <span style="color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;">원</span>
      </div>
    </div>

  </div>

  <!-- Input Card 2 -->
  <div class="card">
    <div class="card-title">수익률 & 기간</div>

    <div class="field">
      <label>월 이자율 <span class="val" id="rateDisplay">1%</span></label>
      <input type="range" id="rate" min="1" max="30" step="0.1" value="1" oninput="update()">
      <div class="number-input">
        <input type="number" id="rateNum" value="1" min="1" max="30" step="0.1" oninput="syncFromNum('rate','rateNum'); update()">
        <span style="color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;">%</span>
      </div>
    </div>

    <div class="field">
      <label>투자 기간 <span class="val" id="yearsDisplay">1년</span></label>
      <input type="range" id="years" min="1" max="20" step="1" value="1" oninput="update()">
      <div class="number-input">
        <input type="number" id="yearsNum" value="1" min="1" max="20" step="1" oninput="syncFromNum('years','yearsNum'); update()">
        <span style="color:var(--muted);font-family:'DM Mono',monospace;font-size:12px;">년</span>
      </div>
    </div>

    <div class="field">
      <label>복리 계산 빈도</label>
      <div class="freq-group" id="freqGroup">
        <button class="freq-btn" data-val="1" onclick="setFreq(1)">연 1회</button>
        <button class="freq-btn active" data-val="12" onclick="setFreq(12)">월 1회</button>
        <button class="freq-btn" data-val="4" onclick="setFreq(4)">분기</button>
        <button class="freq-btn" data-val="365" onclick="setFreq(365)">일 단위</button>
      </div>
    </div>
  </div>

  <!-- Result Card -->
  <div class="result-card">
    <div class="result-top">
      <div class="result-main">
        <div class="result-label">최종 자산</div>
        <div class="result-amount" id="totalAmount">₩0</div>
      </div>
      <div class="result-breakdown">
        <div class="breakdown-item">
          <div class="breakdown-label">원금 합계</div>
          <div class="breakdown-val" id="totalPrincipal">₩0</div>
        </div>
        <div class="breakdown-item">
          <div class="breakdown-label">이자 수익</div>
          <div class="breakdown-val interest" id="totalInterest">₩0</div>
        </div>
        <div class="breakdown-item">
          <div class="breakdown-label">수익률</div>
          <div class="breakdown-val interest" id="totalReturn">0%</div>
        </div>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="growthChart"></canvas>
    </div>
  </div>

  <!-- Table -->
  <div class="table-card">
    <div class="card-title" style="margin-bottom:16px">연도별 성장</div>
    <table>
      <thead>
        <tr>
          <th>연도</th>
          <th>원금 합계</th>
          <th>이자 누적</th>
          <th>자산 총액</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

</div>

<script>
  let freq = 12;

  function setFreq(v) {
    freq = v;
    document.querySelectorAll('.freq-btn').forEach(b => {
      b.classList.toggle('active', +b.dataset.val === v);
    });
    update();
  }

  function syncFromNum(rangeId, numId) {
    const v = parseFloat(document.getElementById(numId).value);
    const range = document.getElementById(rangeId);
    if (!isNaN(v)) range.value = Math.min(Math.max(v, +range.min), +range.max);
  }

  function fmt(n) {
    return '₩' + Math.round(n).toLocaleString('ko-KR');
  }

  function update() {
    const principal = +document.getElementById('principal').value;
    const monthly = +document.getElementById('monthly').value;
    const rate = +document.getElementById('rate').value;
    const years = +document.getElementById('years').value;

    // Sync number inputs
    document.getElementById('principalNum').value = principal;
    document.getElementById('monthlyNum').value = monthly;
    document.getElementById('rateNum').value = rate;
    document.getElementById('yearsNum').value = years;

    document.getElementById('principalDisplay').textContent = fmt(principal);
    document.getElementById('monthlyDisplay').textContent = fmt(monthly);
    document.getElementById('rateDisplay').textContent = rate + '%';
    document.getElementById('yearsDisplay').textContent = years + '년';

    // 월 이자율 기준으로 계산 (freq에 관계없이 월 이자율을 주기별로 환산)
    const monthlyRate = rate / 100;
    const r = Math.pow(1 + monthlyRate, 12 / freq) - 1;
    const monthlyPerPeriod = monthly * 12 / freq;

    let yearData = [];
    let balance = principal;
    for (let y = 1; y <= years; y++) {
      for (let p = 0; p < freq; p++) {
        balance = balance * (1 + r) + monthlyPerPeriod;
      }
      const totalPaid = principal + monthly * 12 * y;
      yearData.push({ year: y, balance, totalPaid, interest: balance - totalPaid });
    }

    const last = yearData[yearData.length - 1];
    const totalPaidFinal = principal + monthly * 12 * years;
    const interestFinal = last.balance - totalPaidFinal;

    document.getElementById('totalAmount').textContent = fmt(last.balance);
    document.getElementById('totalPrincipal').textContent = fmt(totalPaidFinal);
    document.getElementById('totalInterest').textContent = fmt(interestFinal);
    document.getElementById('totalReturn').textContent = ((interestFinal / totalPaidFinal) * 100).toFixed(1) + '%';

    // Table
    const tbody = document.getElementById('tableBody');
    tbody.innerHTML = '';
    yearData.forEach(d => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${d.year}년</td>
        <td>${fmt(d.totalPaid)}</td>
        <td class="int">${fmt(Math.max(0, d.interest))}</td>
        <td class="highlight">${fmt(d.balance)}</td>
      `;
      tbody.appendChild(tr);
    });

    drawChart(yearData, totalPaidFinal);
  }

  function drawChart(yearData, totalPaidFinal) {
    const canvas = document.getElementById('growthChart');
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.offsetWidth;
    const H = 120;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.scale(dpr, dpr);

    const maxVal = Math.max(...yearData.map(d => d.balance));
    const pad = { l: 8, r: 8, t: 12, b: 24 };
    const chartW = W - pad.l - pad.r;
    const chartH = H - pad.t - pad.b;
    const n = yearData.length;

    ctx.clearRect(0, 0, W, H);

    function xOf(i) { return pad.l + (i / (n - 1 || 1)) * chartW; }
    function yOf(v) { return pad.t + (1 - v / maxVal) * chartH; }

    // Principal area
    ctx.beginPath();
    yearData.forEach((d, i) => {
      const x = xOf(i), y = yOf(d.totalPaid);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.lineTo(xOf(n - 1), pad.t + chartH);
    ctx.lineTo(xOf(0), pad.t + chartH);
    ctx.closePath();
    ctx.fillStyle = 'rgba(100,120,140,0.15)';
    ctx.fill();

    // Total area
    const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + chartH);
    grad.addColorStop(0, 'rgba(201,168,76,0.3)');
    grad.addColorStop(1, 'rgba(201,168,76,0.03)');

    ctx.beginPath();
    yearData.forEach((d, i) => {
      const x = xOf(i), y = yOf(d.balance);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.lineTo(xOf(n - 1), pad.t + chartH);
    ctx.lineTo(xOf(0), pad.t + chartH);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Total line
    ctx.beginPath();
    yearData.forEach((d, i) => {
      const x = xOf(i), y = yOf(d.balance);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.strokeStyle = 'rgba(201,168,76,0.8)';
    ctx.lineWidth = 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Principal line
    ctx.beginPath();
    yearData.forEach((d, i) => {
      const x = xOf(i), y = yOf(d.totalPaid);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.strokeStyle = 'rgba(100,120,140,0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Year labels
    ctx.fillStyle = 'rgba(120,112,96,0.7)';
    ctx.font = '9px DM Mono, monospace';
    ctx.textAlign = 'center';
    const step = Math.max(1, Math.floor(n / 6));
    yearData.forEach((d, i) => {
      if (i % step === 0 || i === n - 1) {
        ctx.fillText(d.year + '년', xOf(i), H - 4);
      }
    });
  }

  window.addEventListener('resize', update);
  update();
</script>
</body>
</html>
